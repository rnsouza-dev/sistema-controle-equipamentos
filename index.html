<!DOCTYPE html>
<html lang="pt-br">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Colaboradores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Gestão de controle dos Colaboradores</h1>
        <div id="auth-controls" style="text-align: right; padding: 10px;">
            <button id="btn-login" onclick="fazerLogin()">Entrar (Admin)</button>
                <div id="user-info" style="display: none;">
                    <span id="user-email"></span>
                    <button onclick="fazerLogout()" style="background-color: #6c757d;">Sair</button>
                </div>
        </div>
    </header>

    <main>
        <section id="cadastro" style="display: none;">
            <h2>Cadastrar Novo Colaboradores</h2>
        </section>
            <form id="equipamento-form">
                <input type="text" id="nome" placeholder="Nome do Colaborador" required>
                <input type="text" id="usuario" placeholder="Usuário" required>
                <select id="status">
                    <option value="diarista">Diarista</option>
                    <option value="platonistaN">platonista noturno</option>
                    <option value="plantonistaD">plantonista diario</option>
                </select>
                <button type="submit">Adicionar</button>
            </form>

        <hr>
        <div class="search-container" style="margin-bottom: 15px;">
            <input type="text" id="inputBusca" placeholder="🔍 Buscar por nome ou série..." 
           style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc;">
        </div>
        <section id="lista">
            <h2>Colaboradores Cadastrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Usuário</th>
                        <th>Turno</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-corpo">
                    </tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
